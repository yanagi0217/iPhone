<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--card:#fff;--ink:#171a23;--muted:#6b7280;--acc:#4f46e5;--line:#e6e8ee;--ok:#059669;--err:#b91c1c;--soft:#f6f7fb}
@media(prefers-color-scheme:dark){:root{--card:#1b1f27;--ink:#eeede4;--line:#2b303a;--soft:#11151c}body{background:#0e1217}}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6}
.wrap{padding:12px;max-width:700px;margin:0 auto}
.hero{background:#4f46e5;color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px}
.hero h1{margin:0;font-size:18px;font-weight:500}
.hero p{margin:4px 0 0;font-size:12px;opacity:.9}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:11px;font-size:13px;font-family:inherit;font-weight:500;cursor:pointer}
.tab.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:500}
.step{display:inline-block;width:18px;height:18px;border-radius:50%;background:#4f46e5;color:#fff;font-size:11px;line-height:18px;text-align:center;margin-right:6px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
select,input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:14px;font-family:inherit;background:var(--card);color:var(--ink)}
button{font-family:inherit;cursor:pointer}
.big{width:100%;padding:15px;border-radius:13px;border:none;background:#4f46e5;color:#fff;font-size:15px;font-weight:500}
.big:disabled{opacity:.55}
.btn{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:13.5px;font-weight:500}
.btn.line{border-color:#06c755;color:#06c755;text-decoration:none;display:inline-flex;align-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:#4f46e5;background:#eef2ff}
@media(prefers-color-scheme:dark){.opt:has(input:checked){background:#1a1f2e}}
.opt input{margin-top:3px}
.opt b{font-size:13.5px;font-weight:500;display:block}
.opt small{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.opt .demo{margin-left:auto;flex:0 0 74px;border:1px solid var(--line);border-radius:8px;background:var(--soft);height:44px;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--muted);text-align:center;padding:4px}
.sw{display:flex;gap:11px;align-items:flex-start;cursor:pointer;margin:0}
.sw input{margin-top:4px}
.sw b{font-size:13.5px;font-weight:500;display:block}
.sw small{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.hidden{display:none!important}
.status{font-size:13.5px;color:var(--muted)}
.addrbox{background:#eef2ff;border:1px solid #dfe3ff;border-radius:12px;padding:14px;margin-bottom:12px}
@media(prefers-color-scheme:dark){.addrbox{background:#1a1f2e;border-color:#2b3550}}
.addrbox .label{font-size:11px;color:var(--acc);font-weight:500;margin-bottom:4px;margin:0 0 4px}
.addr{font-size:19px;font-weight:500;line-height:1.45;word-break:break-word}
#map,#map2,#map0{height:210px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.meta{width:100%;border-collapse:collapse;font-size:12.5px}
.meta td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.meta td:first-child{color:var(--muted);width:34%;white-space:nowrap}
.hint{font-size:11.5px;color:var(--muted);margin:8px 0 0}
.err{color:var(--err);font-size:13px}
.okmsg{color:var(--ok);font-size:12px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;background:#eef2ff;color:#4f46e5;margin-left:6px}
.tag.g{background:#dcfce7;color:#15803d}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:7px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #c7c9f5;border-top-color:#4f46e5;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
details{margin-top:8px;font-size:12px;color:var(--muted)}
details pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px}
.hist{display:flex;gap:8px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--card);cursor:pointer}
.hist.on{border-color:#4f46e5}
.hist b{font-size:13.5px;font-weight:500}
.hist small{display:block;color:var(--muted);font-size:11px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.box .t{font-size:12px;color:var(--muted);margin-bottom:6px}
#recvMini{font-size:11.5px;color:var(--muted);padding:8px 2px;cursor:pointer;user-select:none}
#recvMini .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c8cbd3;margin-right:6px;vertical-align:1px}
#recvMini.done .d{background:#22c55e}
#recvBlank{height:46px;cursor:pointer}
</style>
</head>
<body>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var UI=`
<div class="wrap">
 <div id="viewHome">
  <div class="hero"><h1>リンクで相手の住所を特定</h1><p>リンクを送るだけ。相手が開いた瞬間に住所が届きます。</p></div>
  <div class="tabs">
   <button class="tab on" data-t="send">1. 送る</button>
   <button class="tab" data-t="res">2. 結果</button>
   <button class="tab" data-t="set">設定</button>
  </div>

  <div id="tab-send">
   <div class="card">
    <h2><span class="step">1</span>誰に送る？（任意）</h2>
    <input id="name" type="text" placeholder="例：田中">
   </div>

   <div class="card">
    <h2><span class="step">2</span>相手の画面に何を出す？</h2>
    <label class="opt"><input type="radio" name="sty" value="min" checked><span><b>極小</b><small>小さな点と一言だけ。ほぼ気づかれない</small></span><span class="demo">● 確認しました</span></label>
    <label class="opt"><input type="radio" name="sty" value="blank"><span><b>真っ白</b><small>何も表示しない。完全に無言</small></span><span class="demo">（空白）</span></label>
    <label class="opt"><input type="radio" name="sty" value="normal"><span><b>ふつう</b><small>住所と地図をドーンと表示</small></span><span class="demo">住所＋地図</span></label>
   </div>

   <div class="card">
    <h2><span class="step">3</span>精度は？</h2>
    <label class="sw"><input type="checkbox" id="useGps" checked><span><b>正確な位置まで取る（おすすめ）</b><small>番地レベル。ただし初回だけ相手に「許可？」が出ます</small></span></label>
    <p class="hint">OFFにすると市区町村レベル（ダイアログ一切なし）</p>
   </div>

   <button id="mk" class="big">リンクを作る</button>

   <div id="out" class="hidden">
    <div id="mkStatus" class="hint"></div>
    <div class="box">
     <div class="t">これを相手に送る</div>
     <input id="sendLink" readonly>
     <div class="btns">
      <a id="lineSend" class="btn line" target="_blank" rel="noopener">LINEで送る</a>
      <button id="cpSend" class="btn">コピー</button>
     </div>
    </div>
    <div class="box">
     <div class="t">結果を見るリンク（別の端末で見たい時用）</div>
     <input id="viewLink" readonly>
     <div class="btns"><button id="cpView" class="btn">コピー</button></div>
    </div>
    <p class="hint">相手が開いたら「2. 結果」タブを見てください。</p>
   </div>
  </div>

  <div id="tab-res" class="hidden">
   <div class="card">
    <h2>相手の住所</h2>
    <div id="vStatus" class="status"><span class="pulse"></span>読み込み中…</div>
    <div id="vResult" class="hidden">
     <div class="addrbox"><div class="label">推定された住所 <span id="vsrc" class="tag">IP</span></div><div id="vaddr" class="addr">—</div></div>
     <div id="map2"></div>
     <table class="meta" id="vmeta"></table>
     <p class="hint" id="vwhen"></p>
    </div>
    <div class="btns"><button id="refresh" class="btn">更新</button></div>
   </div>
   <div class="card">
    <h2>履歴</h2>
    <div id="histList"></div>
   </div>
  </div>

  <div id="tab-set" class="hidden">
   <div class="card">
    <h2>GitHubトークン（gist権限）</h2>
    <input id="tok" type="text" placeholder="ghp_...">
    <div class="btns"><button id="saveTok" class="big" style="width:auto">保存</button><span id="tokState" class="hint"></span></div>
    <p class="hint">github.com/settings/tokens → Generate new token (classic) → スコープは gist だけ</p>
   </div>
   <div class="card">
    <h2>自分の現在地（おまけ）</h2>
    <div id="status" class="status"><span class="pulse"></span>取得しています…</div>
    <div id="myresult" class="hidden">
     <div class="addrbox"><div class="label">推定された住所 <span id="srcTag" class="tag">IP</span></div><div id="addr" class="addr">—</div></div>
     <div id="map0"></div>
     <table class="meta" id="meta"></table>
     <div class="btns"><button id="myGps" class="btn">GPSで正確に</button></div>
    </div>
   </div>
   <div class="card">
    <h2>診断ログ</h2>
    <details><summary>開く</summary><pre id="diagPre"></pre></details>
    <div class="btns"><button id="test" class="btn">接続テスト</button></div>
   </div>
  </div>
 </div>

 <div id="viewRecv" class="hidden">
  <div id="recvMini" class="hidden"><span class="d"></span><span id="miniTxt">読み込み中…</span></div>
  <div id="recvBlank" class="hidden"></div>
  <div id="recvFull" class="hidden">
   <div class="hero"><h1 id="recvTitle">確認</h1><p id="recvSub">自動で処理されます。</p></div>
   <div class="card">
    <div id="recvStatus" class="status"><span class="pulse"></span>取得しています…</div>
    <div id="recvResult" class="hidden">
     <div class="addrbox"><div class="label">推定された住所 <span id="rsrc" class="tag">IP</span></div><div id="raddr" class="addr">—</div></div>
     <div id="map"></div><table class="meta" id="rmeta"></table>
     <div class="btns"><button id="recvGps" class="btn">GPSで正確に</button></div>
     <div id="recvSend" class="okmsg"></div>
    </div>
   </div>
  </div>
 </div>
</div>`;
document.body.insertAdjacentHTML("afterbegin",UI);
</script>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var LOG=[];
function logline(s){LOG.push(s);var d=$("diagPre");if(d)d.textContent=LOG.join("\n")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(i){$(i).classList.remove("hidden")}
function hide(i){$(i).classList.add("hidden")}
function lineUrl(t){return "https://line.me/R/msg/text/?"+encodeURIComponent(t)}
function J(t){try{return JSON.parse(t)}catch(e){return null}}

var proxyState=null;
function px(u){return location.origin+"/sandbox/proxy?url="+encodeURIComponent(u)}
function raw(method,url,opts){
 opts=opts||{};
 return new Promise(function(res,rej){
  var x=new XMLHttpRequest();
  try{x.open(method,url,true)}catch(e){rej(e);return}
  if(opts.headers)for(var k in opts.headers){try{x.setRequestHeader(k,opts.headers[k])}catch(e){}}
  x.timeout=opts.timeout||20000;
  x.onload=function(){res({ok:x.status>=200&&x.status<300,status:x.status,text:x.responseText,loc:x.getResponseHeader("Location")})};
  x.onerror=function(){rej(new Error("network error"))};
  x.ontimeout=function(){rej(new Error("timeout"))};
  try{x.send(opts.body!=null?opts.body:null)}catch(e){rej(e)}
 });
}
async function req(method,url,opts){
 if(proxyState!==false){
  try{
   var r=await raw(method,px(url),opts);
   if(r.status===404||r.status===405){if(proxyState===true)return r;proxyState=false}
   else{proxyState=true;return r}
  }catch(e){if(proxyState===true)throw e;proxyState=false}
 }
 return await raw(method,url,opts);
}

function mapWho(d){return{lat:+d.latitude,lon:+d.longitude,ip:d.ip,city:d.city,region:d.region,country:d.country,postal:d.postal,isp:(d.connection&&(d.connection.isp||d.connection.org))||"",tz:(d.timezone&&d.timezone.id)||""}}
function mapApi(d){return{lat:+d.latitude,lon:+d.longitude,ip:d.ip,city:d.city,region:d.region,country:d.country_name,postal:d.postal,isp:d.org||"",tz:d.timezone||""}}
async function ipLoc(){
 var S=[["ipwho.is","https://ipwho.is/",mapWho],["ipapi.co","https://ipapi.co/json/",mapApi]];
 for(var i=0;i<S.length;i++){
  try{var r=await req("GET",S[i][1],{timeout:15000});var d=J(r.text);
   if(d&&d.latitude!=null&&d.success!==false)return S[i][2](d)}catch(e){logline("IP "+S[i][0]+" 失敗:"+e.message)}
 }
 throw new Error("IP取得失敗");
}
async function reverse(lat,lon){
 try{var r=await req("GET","https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+lat+"&lon="+lon+"&accept-language=ja&zoom=18",{timeout:15000});
  var d=J(r.text);return (d&&d.display_name)||""}catch(e){return ""}
}
function compose(o){var p=[o.country,o.region,o.city];if(o.postal)p.push("〒"+o.postal);return p.filter(Boolean).join(" ")}
function fillMeta(id,o){
 var rows=[["IPアドレス",o.ip||"—"],["国",o.country||"—"],["都道府県/州",o.region||"—"],["市区町村",o.city||"—"],["郵便番号",o.postal||"—"],["緯度・経度",(+o.lat).toFixed(6)+", "+(+o.lon).toFixed(6)]];
 if(o.acc_m)rows.push(["精度","±"+o.acc_m+"m"]);
 rows.push(["プロバイダ",o.isp||"—"]);rows.push(["タイムゾーン",o.tz||"—"]);
 $(id).innerHTML=rows.map(function(r){return "<tr><td>"+esc(r[0])+"</td><td>"+esc(r[1])+"</td></tr>"}).join("");
}
var maps={};
function drawMap(cid,lat,lon,z){
 if(!window.L||!$(cid))return;
 if(!maps[cid]){
  maps[cid]=L.map(cid,{scrollWheelZoom:false}).setView([lat,lon],z||13);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2nve_1_afe1da6ca18e958f7724fb54",{maxZoom:19,attribution:"© OpenStreetMap © CartoDB"}).addTo(maps[cid]);
 } else maps[cid].setView([lat,lon],z||16);
 var m=maps[cid];if(m.__mk)m.removeLayer(m.__mk);
 m.__mk=L.marker([lat,lon]).addTo(m);
 setTimeout(function(){m.invalidateSize()},200);
}

var TOKEN=localStorage.getItem("loclink_tok")||"";
var HIST=J(localStorage.getItem("loclink_hist")||"[]")||[];

var GH="https://api.github.com/gists";
function ghH(){return{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN}}
async function createBlob(data){
 var j=JSON.stringify(data);
 if(!TOKEN)return null;
 var r=await req("POST",GH,{headers:ghH(),body:JSON.stringify({description:"loclink",public:false,files:{"loc.json":{content:j}}}),timeout:20000});
 var o=J(r.text);
 if(!r.ok||!o||!o.id)throw new Error("HTTP "+r.status+(o&&o.message?" "+o.message:""));
 logline("Gist作成 OK");
 return o.id;
}
async function writeBlob(id,data){
 var r=await req("PATCH",GH+"/"+id,{headers:ghH(),body:JSON.stringify({files:{"loc.json":{content:JSON.stringify(data)}}}),timeout:20000});
 if(!r.ok)throw new Error("HTTP "+r.status);
}
async function readBlob(id){
 var r=await req("GET",GH+"/"+id,{timeout:15000});
 if(!r.ok)throw new Error("HTTP "+r.status);
 var o=J(r.text);
 var c=o&&o.files&&o.files["loc.json"]&&o.files["loc.json"].content;
 return c?J(c):null;
}

// タブ
var curTab="send";
function tab(t){
 curTab=t;
 [].forEach.call(document.querySelectorAll(".tab"),function(b){b.classList.toggle("on",b.getAttribute("data-t")===t)});
 hide("tab-send");hide("tab-res");hide("tab-set");
 show("tab-"+t);
 if(t==="res")renderHist();
}
[].forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){tab(b.getAttribute("data-t"))}});

// 履歴
function renderHist(){
 var box=$("histList");
 if(!HIST.length){box.innerHTML='<p class="hint">まだリンクを作っていません。</p>';return}
 box.innerHTML=HIST.map(function(h,i){
  return '<div class="hist'+(h.id===curId?" on":"")+'" data-i="'+i+'"><span><b>'+esc(h.name||"（名前なし）")+'</b><small>'+new Date(h.at).toLocaleString("ja-JP")+'</small></span></div>';
 }).join("");
 [].forEach.call(box.querySelectorAll(".hist"),function(el){
  el.onclick=function(){var h=HIST[+el.getAttribute("data-i")];curId=h.id;renderHist();loadResult(h.id)};
 });
}
var curId=null;

function getPos(hi,ms){return new Promise(function(res,rej){navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:hi,timeout:ms,maximumAge:0})})}
async function refine(cid,addrEl,srcEl,cur,cb){
 if(!navigator.geolocation){logline("GPS非対応");if(cb)cb(null);return}
 var pos=null;
 try{pos=await getPos(true,22000)}
 catch(e1){logline("高精度失敗→通常で再試行");try{pos=await getPos(false,15000)}catch(e2){logline("GPS失敗:"+e2.message);if(cb)cb(null);return}}
 var lat=pos.coords.latitude,lon=pos.coords.longitude;
 cur.acc_m=Math.round(pos.coords.accuracy||0);
 var full=await reverse(lat,lon);
 cur.lat=lat;cur.lon=lon;cur.addr=full||("緯度経度 "+lat.toFixed(6)+", "+lon.toFixed(6));cur.acc="gps";
 if(addrEl)$(addrEl).textContent=cur.addr;
 if(srcEl){$(srcEl).textContent="GPS";$(srcEl).className="tag g"}
 fillMeta(cid==="map"?"rmeta":"meta",cur);
 drawMap(cid,lat,lon,17);
 if(cb)cb(cur);
}

function startHome(){
 show("viewHome");document.title="リンクで住所特定";
 if(TOKEN)$("tok").value=TOKEN;
 if(!TOKEN)$("tokState").innerHTML='<span class="err">未設定</span>';else $("tokState").innerHTML='<span class="okmsg">設定済み</span>';
 $("saveTok").onclick=async function(){
  var v=$("tok").value.trim();
  if(!v){localStorage.removeItem("loclink_tok");TOKEN="";$("tokState").textContent="消しました";return}
  $("tokState").innerHTML='<span class="spin"></span>確認中…';
  try{
   var r=await req("GET","https://api.github.com/user",{headers:{"Authorization":"Bearer "+v},timeout:15000});
   if(r.ok){var o=J(r.text);localStorage.setItem("loclink_tok",v);TOKEN=v;$("tokState").innerHTML='<span class="okmsg">OK: @'+esc(o.login||"")+'</span>';logline("トークン OK @"+(o.login||""))}
   else $("tokState").innerHTML='<span class="err">無効（HTTP '+r.status+'）</span>';
  }catch(e){$("tokState").innerHTML='<span class="err">'+esc(e.message)+'</span>'}
 };
 $("mk").onclick=makeLink;
 $("test").onclick=function(){logline("--- テスト ---");createBlob({test:1}).then(function(id){logline(id?"テスト OK":"トークン未設定")}).catch(function(e){logline("テスト失敗: "+e.message)})};
 $("refresh").onclick=function(){if(curId)loadResult(curId)};

 var cur={};
 (async function(){
  try{var o=await ipLoc();cur=o;$("addr").textContent=compose(o);fillMeta("meta",o);
   $("status").innerHTML='<span class="okmsg">取得しました</span>';show("myresult");drawMap("map0",o.lat,o.lon,13);
   $("myGps").onclick=function(){$("myGps").textContent="取得中…";refine("map0","addr","srcTag",cur,function(){$("myGps").textContent="GPSで正確に"})};
  }catch(e){$("status").innerHTML='<span class="err">取得失敗</span>'}
 })();
}
function makeLink(){
 var self=this,name=$("name").value.trim();
 var sty=document.querySelector('input[name=sty]:checked').value;
 var g=$("useGps").checked?"&g=1":"";
 show("out");$("mkStatus").innerHTML='<span class="spin"></span>作成中…';self.disabled=true;
 (async function(){
  var base=location.href.split("#")[0];
  logline("--- リンク作成 ---");
  var id;
  try{id=await createBlob({waiting:true,at:Date.now()})}
  catch(e){$("mkStatus").innerHTML='<span class="err">作成失敗: '+esc(e.message)+'</span>';self.disabled=false;self.textContent="リンクを作る";return}
  if(!id){$("mkStatus").innerHTML='<span class="err">トークンが未設定です（設定タブ）</span>';self.disabled=false;self.textContent="リンクを作る";return}
  var sendU=base+"#n="+encodeURIComponent(name)+"&r="+id+"&v="+sty+g+(TOKEN?"&t="+encodeURIComponent(TOKEN):"");
  var viewU=base+"#r="+id;
  $("sendLink").value=sendU;$("viewLink").value=viewU;
  $("lineSend").href=lineUrl(sendU);
  HIST.unshift({id:id,name:name,at:Date.now()});HIST=HIST.slice(0,20);
  localStorage.setItem("loclink_hist",JSON.stringify(HIST));
  curId=id;
  $("mkStatus").innerHTML='<span class="okmsg">できました。LINEで送ってください。</span>';
  self.disabled=false;self.textContent="作り直す";
 })();
}

var vt=null,vc=0;
async function loadResult(id){
 if(!id)return;
 vc=0;if(vt)clearInterval(vt);
 show("vStatus");$("vStatus").innerHTML='<span class="pulse"></span>読み込み中…';hide("vResult");
 var once=async function(){
  vc++;
  try{
   var d=await readBlob(id);
   if(d&&d.lat!=null){
    $("vaddr").textContent=d.addr||(d.country+" "+d.region+" "+d.city);
    $("vsrc").textContent=d.acc==="gps"?"GPS":"IP";$("vsrc").className=d.acc==="gps"?"tag g":"tag";
    fillMeta("vmeta",d);
    $("vStatus").innerHTML='<span class="okmsg">取得しました</span>';show("vResult");drawMap("map2",d.lat,d.lon,d.acc==="gps"?17:13);
    $("vwhen").textContent="記録: "+new Date(d.at||Date.now()).toLocaleString("ja-JP")+(d.acc_m?("　精度 ±"+d.acc_m+"m"):"");
    if(vt){clearInterval(vt);vt=null}
   }else if(vc>=15){
    if(vt){clearInterval(vt);vt=null}
    $("vStatus").innerHTML='<span class="pulse"></span>まだ開かれていません。「更新」で再確認。';
   }else $("vStatus").innerHTML='<span class="pulse"></span>まだ開かれていません。（'+vc+'/15）';
  }catch(e){$("vStatus").innerHTML='<span class="err">読み込み失敗: '+esc(e.message)+'</span>'}
 };
 await once();
 if(!vt)vt=setInterval(function(){if(vc>=15){clearInterval(vt);vt=null;return}once()},20000);
}

function startRecv(){
 hide("viewHome");show("viewRecv");
 var hp=new URLSearchParams(location.hash.replace(/^#/,""));
 var N=hp.get("n")||"",R=hp.get("r")||"",G=hp.get("g")==="1",V=hp.get("v")||"normal";
 if(hp.get("t"))localStorage.setItem("loclink_tok",hp.get("t"));
 var cur={};
 if(V==="blank"){show("recvBlank");document.title="";$("recvBlank").onclick=function(){show("recvFull")}}
 else if(V==="min"){show("recvMini");document.title="";$("recvMini").onclick=function(){$("recvFull").classList.toggle("hidden")}}
 else{show("recvFull");document.title="確認";if(N)$("recvTitle").textContent=N+" さんからのリンクです"}
 if(V==="min"&&G)$("miniTxt").textContent="位置情報を「許可」してください";
 (async function(){
  try{
   var o=await ipLoc();cur=o;var a=compose(o);
   $("raddr").textContent=a;fillMeta("rmeta",o);show("recvResult");
   $("recvStatus").innerHTML='<span class="okmsg">完了</span>';drawMap("map",o.lat,o.lon,13);
   function save(){
    if(!R)return;
    writeBlob(R,{lat:cur.lat,lon:cur.lon,ip:cur.ip,city:cur.city,region:cur.region,country:cur.country,postal:cur.postal,isp:cur.isp,tz:cur.tz,addr:cur.addr||a,acc:cur.acc||"ip",acc_m:cur.acc_m||0,at:Date.now()})
     .then(function(){$("recvSend").textContent=cur.acc==="gps"?"（GPSで保存しました）":"（自動で保存しました）"})
     .catch(function(e){$("recvSend").innerHTML='<span class="err">保存に失敗: '+esc(e.message)+'</span>'});
   }
   save();
   var doGps=function(){
    $("recvGps").textContent="取得中…";if(V==="min")$("miniTxt").textContent="位置を取得中…";
    refine("map","raddr","rsrc",cur,function(){
     $("recvGps").textContent="GPSで正確に";
     if(V==="min"){$("miniTxt").textContent="確認しました";$("recvMini").classList.add("done")}
     save();
    });
   };
   $("recvGps").onclick=doGps;
   if(G)doGps();
   else if(V==="min"){$("miniTxt").textContent="確認しました";$("recvMini").classList.add("done")}
  }catch(e){$("recvStatus").innerHTML='<span class="err">取得に失敗しました</span>';if(V==="min")$("miniTxt").textContent="失敗"}
 })();
}

var hp0=new URLSearchParams(location.hash.replace(/^#/,""));
if(hp0.get("n"))startRecv();
else{
 startHome();
 var r0=hp0.get("r");
 if(r0){curId=r0;tab("res");loadResult(r0)}
}
})();
</script>
